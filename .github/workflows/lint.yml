name: Lint

on:
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
        matrix:
          node-version: [18.x, 20.x]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use a cache for npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm  # Cache npm dependencies
          key: ${{ runner.os }}-node-${{ matrix.node-version }} # Unique key per Node.js version
          restore-keys: |  # Attempt to restore cache from previous runs
            ${{ runner.os }}-node-   # Cache all Node.js versions

      - name: Install dependencies
        run: |
          npm install eslint@9.24.0  # Use the compatible version of ESLint
          npm install eslint-plugin-astro@1.3.1
          npm install eslint-plugin-jsx-a11y@6.10.2
          npm install @typescript-eslint/parser@8.29.1
          npm install @typescript-eslint/eslint-plugin@8.29.1
          npm install @stylistic/eslint-plugin@4.2.0
          npm install typescript@5.8.3

      - name: Run ESLint
        run: npx eslint . \
          --config .eslintrc.js \
          --ext .js,.ts,.astro src
